<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="director-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baton-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="slate-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#director-glow)"/>

  <!-- Director Baton (Crossing Behind) -->
  <g class="director-baton">
    <!-- Baton shadow -->
    <line x1="8" y1="56" x2="56" y2="8" stroke="#000000" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
    <!-- Baton body -->
    <line x1="8" y1="56" x2="56" y2="8" stroke="url(#baton-grad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Baton handle grip rings -->
    <line x1="12" y1="52" x2="15" y2="49" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="18" y1="46" x2="21" y2="43" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Baton tip golden ferrule -->
    <circle cx="55" cy="9" r="3.2" fill="url(#gold-grad)"/>
    <!-- Magic director spark star -->
    <path d="M55 2 L56.5 7.5 L62 9 L56.5 10.5 L55 16 L53.5 10.5 L48 9 L53.5 7.5 Z" fill="#38bdf8"/>
    <circle cx="55" cy="9" r="1.3" fill="#ffffff"/>
  </g>

  <!-- Director Clapperboard (Foreground) -->
  <g class="director-slate">
    <!-- Clapperboard Lower Slate Body -->
    <rect x="11" y="26" width="40" height="28" rx="4" fill="url(#slate-body)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Inner Slate Info Grid Lines (Scene / Take / Prod) -->
    <line x1="17" y1="35" x2="45" y2="35" stroke="#475569" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="17" y1="43" x2="45" y2="43" stroke="#475569" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Slate Text Bars (Action! / Director lines) -->
    <rect x="17" y="31" width="13" height="2.2" rx="1.1" fill="#38bdf8" opacity="0.85"/>
    <rect x="33" y="31" width="12" height="2.2" rx="1.1" fill="#f59e0b" opacity="0.85"/>
    <rect x="17" y="39" width="9" height="2.2" rx="1.1" fill="#94a3b8" opacity="0.75"/>
    <rect x="29" y="39" width="16" height="2.2" rx="1.1" fill="#94a3b8" opacity="0.75"/>
    <!-- Director Clapper Cut Star Badge -->
    <path d="M31 48 L32 45.5 L34.5 45.5 L32.5 44 L33.2 41.5 L31 43 L28.8 41.5 L29.5 44 L27.5 45.5 L30 45.5 Z" fill="url(#gold-grad)"/>

    <!-- Clapperboard Hinge Pivot -->
    <circle cx="14" cy="23.5" r="2.8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Angled Top Clapper Arm (Tilted Open ~15deg) -->
    <g transform="rotate(-15 14 23.5)">
      <!-- Top Arm Base -->
      <rect x="12" y="18" width="40" height="8.5" rx="2.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
      <!-- Classic Director Zebra Stripes (Cyan & Gold) -->
      <path d="M19 18.5 L14.5 26" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M28 18.5 L23.5 26" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M37 18.5 L32.5 26" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M46 18.5 L41.5 26" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>